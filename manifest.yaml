  - "**帧率统计口径已在 M3 收口轮修正（L-11 已关闭）**：loop_stats() 现同时提供 avg/p95/max_ms（每帧 draw+flush 耗时）与 avg/p95/max_interval_ms（真正的帧间隔），自检第 3 节与 [LOOP] 行都分开打印，REQ-101 判据一律用后者。**口径修正后暴露出一个重要事实：真实帧间隔 p95=34ms 正好卡在 CR-04 的上限，每帧处理已占 31~32ms（其中 flush 29ms 等 VSYNC），只剩 1~2ms 余量。** 前几轮报的 avg=28ms 是 work 口径，不代表有余地。"
  - "**帧率余量很紧，是本项目当前最大的技术风险**：iv_max 已经到过 38ms（瞬时约 26fps），只因为占比不到 5% 才没拉高 p95；掉帧计数阈值是 33+5=38ms（需严格大于），也就是说**目前卡在边界上，拖到 39ms 就会开始计 drop**。后续若要加长按条、特效或判定文字动画，这 1~2ms 大概率不够。"
  - "**自检的注入 FAIL 是编译期开关造出来的**（SELFTEST_INJECT_BAD_CHART=1），不是运行时检测到真实坏数据。真实坏数据场景（例如 TF 卡上的谱面出错）属于 P1 范畴，未验证。"
  - "判定延迟直方图统计的是「触摸中断到判定执行」，**不是「触摸到画面翻转」**；后者仍需 GPIO 打点（对应 REQ-104 未闭合的那一半）。"
  - "自检的三节都在 TITLE 停留期间采样（第 3 节固定在 150 帧触发），**未覆盖长时间演奏下的帧率自检**；如果要看演奏中的自检数据，需要改成多次触发或延后触发时机。"
  - "**REQ-103 的「连续演奏」曾降级为「连续运行」（M3），已由 2026-11-07 重测取代**：M3 那轮 11.2 分钟里学生玩了若干局并停留在主界面，不是从头到尾一直在演奏，当时无自动演奏脚本，故只能写「连续运行」。**2026-11-07 已用自动演奏固件重测：11.3 分钟 / 12 局 / 20400 帧、全程无复位、断言 0 次、堆 used 恒为 113084B 零漂移，是真正的「连续演奏」，TC-103 判 PASS。**M3 旧结论保留不删，仅说明口径已被升级；残留局限是点击由软件注入、不经 FT6146 中断，故该日志不能用于 TC-104。"
  - "**帧率余量已降到 0~2ms**：11 分钟长跑后 work=33ms（flush 30ms），而目标帧间隔就是 33ms，帧循环已没有任何 rt_thread_delay 余量，靠「刚好赶上」在跑。p95 仍为 34ms 是因为抖动未超 38ms。**这是当前最大的技术风险**，M4 若要加长按条/特效/判定文字动画很可能掉帧。"
  - "**全程 USB 供电，不接电池（2026-10-17 学生决定，R-04 关闭）**：官方 `mp3_sd_player/README.md` 第 23 行明确该平台要求电池的唯一原因是「长按按键检测」，而本项目全用触摸、不用按键。**残留风险（未验证）**：功放 AW8155 驱动喇叭时峰值电流可能超过 USB 的 500mA，症状是随机复位 / 播放卡顿 / 喇叭爆音，而不是明确报错。**若以后遇到「莫名其妙复位」，先想到供电不足，别一头扎进代码里查。** "
  - "**REQ-009 音效已能发声，但连续敲击时音量逐步增大（L-12，2026-10-25，未定位）**：命中发声本身正常，`feed_prev`（首样本写入音频缓存）实测 4~10ms，13 个样本 100% ≤20ms。但密集敲击时每一下比上一下响、到某上限后不再变大；静音约 5 秒后再敲，第一声又偏小。已排除：音量值变化（日志中 `vol` 全程恒定）、音效重叠（`skipped` 恒为 0）、`vol==AUDIO_MAX_VOLUME` 的特殊增益分支、16k/48k 采样率下 voice/music EQ 的差异、`bf0_audprc_eq_enable_offline(0)` 关闭 EQ。行为特征符合自动增益（AGC），但关掉 EQ 后仍未消失。**学生决策按方案 A 接受现状**，登记为已知缺陷；下一步可试「每次命中重建 audio client」（老师工程用的模式，但会牺牲延迟）。"
  - "**喇叭曾接到错误的座上（P-12，2026-10-25，已关闭）**：REQ-009 首轮实现时喇叭插在错误的座子（不是功放输出那个），导致连续 6 轮烧录全部无声，而软件侧诊断数值全部正常（`audio_open2` 成功、`audio_write` 返回写入成功、PA42 已使能、DAC 已取消静音）。由学生自己发现并改接后立即出声。**教训：外设无声类排查必须先确认物理输出环节，并用一件确定能出声的第三方固件（老师提供的 peripheral_lab 工程）做基线对照。**"

self_review: |
  M4「测试与交付」进行中的自评（截至 2026-10-31）。P0（REQ-001~007）已在 M3 收口并上板验证，
  本阶段只动 P1 音频链路与帧率相关项。

  做得扎实的部分：
  - 内存问题用数据定位，不靠猜：新增堆探针 src/memprobe.c，逐段量出
    「帧缓冲 351KB 独占系统堆 80%」这一真因，进而把帧缓冲迁到 PSRAM（CR-06），
    堆余量由 75KB 提升到 426KB。
  - 失败记录一律保留不覆盖：混音首次开启的断言日志、48kHz 版本 36ms FAIL 的日志、
    脏区优化出现拖影的那一版，全部入库并在 docs/04 逐条登记。
  - 用自动演奏（src/autoplay.c）把「连续演奏」这一口径补上，因此发现了此前
    所有帧率证据都是错的。

  agent 必须如实标注的不确定与失误：
  1. **口径错误（本阶段最严重）**：此前多轮「p95=34ms PASS」全部是在板子停在 TITLE、
     无 BGM、无音符的静止画面上量到的，与 REQ-101 字面要求的「连续演奏」不符。
     直到加入自动演奏才暴露：真实负载下 p95=40ms，**不达标**。旧记录已在 docs/04 作废。
  2. **两次错误归因**（docs/06 AI-09）：先归因于 PCM 回调里 cast 掉 const 写入，
     后又归因于「开混音导致堆不足」，都被实测推翻。
  3. **因搜错宏名否定能力**（AI-10）：只搜 BSP_USING_PSRAM1 就断言 PSRAM 不可用，
     实际本板用的是 BSP_USING_PSRAM 且 bsp_init.c 确实初始化了它。
  4. **为指标好看而忽略功能正确性**（AI-11）：脏区优化数据很好但出现音符拖影，
     agent 自己在汇报里已写「可能留残影」，却仍先把它当成有效优化，是学生上板目测才否掉的。
  5. TC-008 的音画对齐判据**仍未判定**：录到 +82.2ms，但无法与手机录像自身的音画偏置分离，
     补拍的拍手校准片未识别到事件，学生决定不再补拍（docs/04 L-15）。
  6. src/memprobe.c 与 src/autoplay.c 都是临时诊断/压测代码，前者待删、
     后者 AUTOPLAY_ENABLE 默认开启，正式演示前必须置 0。
  7. REQ-104 的端到端延迟（触摸到画面翻转）始终未闭合，现有直方图只覆盖
     「触摸中断到判定执行」。

  由学生介入或纠正后才改的决策：
  - 学生上板目测发现音符拖影，推翻了 agent 的脏区渲染优化（已回退）。
  - 学生选定按 CR-05 改用内存嵌入 MP3；选定混音方案 A（SDK 官方软件混音）。
  - 学生在进度压力下决定「先不做慢动作录像、用普通录像凑一个」，并在校准片失败后
    决定不再补拍——相关判据按「未判定」记录，未判为通过。

