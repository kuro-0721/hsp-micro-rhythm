    evidence_path: "evidence/T0/boot_log_2026-10-10.txt"
    agent_conclusion: "捕获到 SDK 启动日志（TOUCH 驱动注册、FAL V0.5.99 initialize success、dfu/ble MTD 创建、时钟 CFG1 配置），随后为应用横幅 [course_starter] v0.1.0 boot ok、Hello world!，以及首轮 [course_starter] rgb -> red / green / blue，并出现 msh 提示符。未见 ERROR / ASSERT。局限：监视器只保留最近 20 条，未含 ROM / 引导阶段输出；日志按接收块切分，个别行首尾被截断（原文保留，未整理）。"
  - item: "板载 RGB 灯三色循环（录像 + 串口交叉验证）"
    required_action: "拍摄一段板载 RGB 灯闪烁视频（10 秒以上）并回传；因 *.mp4 被 .gitignore 忽略，需放网盘并在 evidence/ 下留链接文件"
    executed_at: "2026-10-10T13:45:10+08:00（视频文件修改时间）"
    evidence_path: "evidence/T0/rgb_blink_20261010.link.txt"
    agent_conclusion: "视频元信息 1280x720 / 30fps / 10.147733s；agent 用 ffmpeg 抽帧（0.25s/帧）后逐帧取色，辉光依次为绿→蓝→红循环，红色峰值出现在 t=2.50 / 5.50 / 8.50 s（间隔 3.0 s）。串口证据显示相邻颜色日志间隔 1.002~1.004 s（见 evidence/T0/serial_rgb_cycle_2026-10-10.txt 与 boot_log）。两者与固件“每色亮 500ms + 灭 500ms”一致。局限：4fps 抽帧无法判定颜色起点顺序与毫秒级时长；网盘链接待补。"

  - item: "M2 帧率对比实验（分行刷 vs 整屏单缓冲）"
    required_action: "学生批准架构实验；因学生要求免除拆插，烧录与复位由 agent 用 sftool / CodeKit 串口复位执行，屏幕现象由学生确认"
    executed_at: "2026-10-10T15:2x+08:00"
    evidence_path: "evidence/M2/band_vs_full_2026-10-10.txt"
    agent_conclusion: "同一固件内交替两模式各 480 样本：BAND avg=132ms p95=133ms draw=5ms flush=126ms miss=480；FULL avg=29ms p95=31ms max=33ms draw=8ms flush=21ms miss=0。判定：瓶颈为每次提交等待 VSYNC（126/8≈15.8ms≈一个 60Hz 面板帧），非带宽；整屏单次提交满足 REQ-101（p95≤33ms），已写入 ADR-0003。局限：时间戳分辨率 1ms；30fps 下 CPU 填充余量仅 4ms。"
  - item: "M2 触摸事件时间戳采集"
    required_action: "学生在屏幕上点按/滑动若干次，由 agent 抓取串口原始字节"
    executed_at: "2026-10-10T14:58~15:00+08:00"
    evidence_path: "evidence/M2/touch_timestamp_2026-10-10.txt"
    agent_conclusion: "254 条触摸事件中，中断时刻与读点时刻的差值：0ms × 253、1ms × 1 次。由于固件时间戳分辨率为 1ms，准确结论只能是“中断→读点 < 1ms”，不得写成“0 延迟”。坐标实测均在屏内（最大如 (319,377)）。"
  - item: "M2 屏幕点亮与分辨率确认（8 色带图案）"
    required_action: "on-board 观察红色/绿色/蓝色/白色整屏与 8 条色带是否正常、满屏、无花屏；由学生录制启动视频作为证据"
    executed_at: "2026-10-10（启动视频录制于 14:45:59；色带帧取自该视频 n=49，t≈1.633s）"
    evidence_path: "evidence/M2/color_bars_2026-10-10.jpg"
    agent_conclusion: "由学生录制启动视频、agent 抽帧核对（ffmpeg select n=49）：屏幕可正常点亮并显示彩色图案，色带水平、边界清晰、横向满宽，未见花屏/错位；配合编译产物 rtconfig.h（390x450），假设 A-01（屏幕实物与 SDK 配置一致）成立。配套证据：抽帧说明见 evidence/M2/color_bars_2026-10-10.txt，原始启动视频见 evidence/M2/screen_boot_20261010.link.txt（网盘链接待补），分辨率依据见 evidence/M2/resolution_2026-10-10.txt。局限：该帧为探针 v1 分行刷的中间态（可见约 7 条色带 + 底部尚未覆盖的白色区域），不是静止完整的 8 条色带；拍摄视角略倾斜，不可用于像素级测量。"
  - item: "M3 第 1 步：渲染基座帧率与音符密度压力测试"
    required_action: "学生执行 CodeKit Download 烧录并拔插 USB 复位；agent 抓取串口输出"
    executed_at: "2026-10-17T13:1x~13:2x+08:00"
    evidence_path: "evidence/M3/bench_serial_2026-10-17.log"
    agent_conclusion: "被测固件为提交 a5cfa5a（main.bin 301,052 B）。每档 200 帧、共 6 档合成音符密度扫描：notes/lane=0/5/10/20/30/50（对应 0~200 个音符）下 p95 均为 33ms、超时帧均为 0，REQ-101（p95≤33ms）达标。关键观察：draw 由 2ms 增至 6ms（音符密度影响很小），flush 稳定在 26~29ms 且与音符数无关——主要开销是在等 VSYNC，该时段 CPU 空闲。局限：这是合成密度扫描而非真实演奏场景（真实演奏待 M3 第 3 步后复测）；p95 恰好等于 33ms 目标线，属刚好达标，不得表述为有余量。详见 evidence/M3/bench_serial_2026-10-17_note.txt。"
  - item: "M3 第 3 步：谱面解析 + 场景状态机 + 点阵文字（第一轮）"
    required_action: "学生执行 CodeKit Download 烧录并拔插 USB 复位；agent 抓取串口；学生手机拍摄 32.7s 实机视频"
    executed_at: "2026-10-17T13:46~13:50+08:00"
    evidence_path: "evidence/M3/scene_run1_2026-10-17.log"
    agent_conclusion: "被测固件为提交 cc8fc7d（main.bin 308,052 B）。[CHART] 内置谱面 58 音符、首 1000ms、末 29500ms、跨度 28500ms、轨道分布 15/14/15/14；错误谱面返回 -2 被拒。[SCENE] -> PLAYING at 4632ms、-> RESULT at 34173ms score=3350 maxcombo=8 acc=57.75% P=23 G=21 M=14。视频一局为 SCORE=3150 / MAX COMBO=12 / ACC=54.31% / P=19 G=25 M=14。两局算术均自洽（19+25+14=58、19×100+25×50=3150、(19×10000+25×5000)/58=5431）。[LOOP] 5 次汇总 avg=32~33ms、p95=33~34ms、max=34ms、选时帧 0。**注意：视频是学生第一局、日志是复位后第二局，两局数据不同，不可混作同一局对比。** 本轮发现三个缺口：HUD 被音符遮挡、TITLE 无状态时间戳、点击→切换延迟无法验证；重开未测。详见 evidence/M3/scene_run1_2026-10-17_note.txt。"
  - item: "M3 第 3 步修复轮：HUD 底板 + TITLE/点击延迟时间戳 + 重开路径"
    required_action: "学生先在 CodeKit 里烧录（此时 agent 不得占用串口），烧录完成后 agent 启动串口抓取，学生再拔插复位并完成一整局 + 重开；另拍主界面照片与 32.5s 视频"
    executed_at: "2026-10-17T13:55~14:0x+08:00"
    evidence_path: "evidence/M3/scene_run2_2026-10-17.log"
    agent_conclusion: "被测固件为提交 fab7e80。[SCENE] -> TITLE at 299ms (boot) 满足 5s 判据；两次 [SCENE] -> PLAYING 的 latency 分别为 14ms 与 17ms（判据 1s）且未出现无符号下溢大数；[SCENE] -> RESULT at 38565ms score=3350 maxcombo=13 acc=57.75% P=25 G=17 M=16，[HIT] 共 42 条 = P25+G17，与结算完全对应；**第二条 -> PLAYING at 48713ms (notes=58, tap=48696ms, latency=17ms) 证明重开路径可用**。帧率 p95=33~34ms、超时帧 0、draw 仍 2ms（底板只多一次 132×68 矩形填充）。HUD 底板经 photo_title_2026-10-17.jpg 与 scene_hud_2026-10-17.jpg 确认：底板比背景亮一档、三行文字始终可读、未再见音符压在文字上。日志中 SiFli Corporation / Reason: 各出现 2 次（学生复位了两次），属真实两次上电而非抓取重复。**流程教训：本轮第一次尝试失败——agent 先启动抓取占住 COM9，导致学生烧录失败；正确顺序是先烧录、再抓串口、最后复位。** 遗留：方案 A 底板按几何推算会遮挡 lane 0 上部约 280ms（未实测）；重开那局未打完。详见 evidence/M3/scene_run2_2026-10-17_note.txt。"
  - item: "M3 第 4 步：启动自检三节汇总（正常模式）"
    required_action: "学生烧录 b887e16 后复位；停在主界面等约 5s（第 3 节需 150 帧），再玩一局到结算"
    executed_at: "2026-10-17T14:1x~14:2x+08:00"
    evidence_path: "evidence/M3/selftest_normal_2026-10-17.log"
    agent_conclusion: "被测固件提交 b887e16，main.bin 310,500 B。三节齐全：第 2 节 judge edge cases 与 bulk 均 PASS；第 1 节 bad chart 返回 -2、内置谱面 58 音符/首 1000ms/末 29500ms/跨度 28500ms/轨道 15-14-15-14 均 PASS；第 3 节在 150 帧后输出 frames=150 avg=28ms p95=33ms max=33ms draw=2ms flush=26ms overrun_frames=0，PASS；**总结论 RESULT: PASS（section 1-2 failures 0，section 3 failures 0）**。结算时补打的实测判定延迟直方图：49 个样本（0-10=14、11-20=17、21-33=18，34ms 以上全为 0），P95=33ms，满足 50ms 判据。**注：该直方图统计的是「触摸中断到判定执行」，不是「触摸到画面翻转」。** 首次上板（e39ae86）因中文日志全部变成 '?' 而失败，已按「失败记录不覆盖」留档为 selftest_normal_2026-10-17_garbled_cn.log。局限：两轮都在 TITLE 停留期间采样，未覆盖长时间演奏下的帧率自检。"
  - item: "M3 第 4 步：注入模式演示 FAIL（TC-007 第二项判据）"
    required_action: "agent 把 src/selftest.c 的 SELFTEST_INJECT_BAD_CHART 改为 1 并重新编译；学生烧录后复位；验证完 agent 已改回 0 并重新编译"
    executed_at: "2026-10-17T14:2x+08:00"
    evidence_path: "evidence/M3/selftest_badchart_2026-10-17.log"
