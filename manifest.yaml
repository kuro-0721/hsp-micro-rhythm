known_issues:
  - "**REQ-101 判据已放宽且未测准（CR-04，2026-10-17）**：帧间隔用 rt_tick_get_millisecond() 打点，分辨率仅 1ms。M3 第 2 步引入触摸后 p95 从 33ms 变为 34ms，恰好卡在分辨率边界上，无法判断是真实恶化还是量化误差。agent 给出的三个方案里建议先用 DWT 周期计数器做亚毫秒测量（方案 A），**学生选择直接放宽判据（方案 B）**。因此“这 1ms 是否真的掉了”至今未被证伪，详见 docs/06 的 R-10。"
  - "参与对比的三轮数据：M3 第 1 步（无触摸代码）p95=33ms；第 2 步第 1/2 轮（bridge 优先级 19，有/无触摸事件）p95=34ms；第 3 步第 3 轮（优先级 25）p95=34ms。已排除的两个假设：线程优先级抢占、触摸事件突发；未验证的假设：FT6146 驱动以 BSP_TOUCH_SAMPLE_HZ=120 周期采样（约 8.3ms 一次 I2C）。"
  - "**流程偏离**：M2 阶段的固件烧录与启动复位由 agent 执行（学生要求免除拆插 USB），屏幕现象由学生确认；未按“学生亲自烧录”记录（docs/06 的 P-09）。"
  - "M2 的时间戳基于 rt_tick_get_millisecond()，分辨率仅 1ms，因此触摸“中断→读点 0ms”只能表述为 <1ms，不能当精确值；端到端延迟（REQ-104）仍需 GPIO 打点测量。"
  - "帧率虽达标（p95 31ms），但 30fps 下 CPU 填充仅剩 4ms 余量；音符密集时可能掉帧，后续必须只刷脏区或启用 EPIC 硬件 2D 加速。"
  - "M2 屏幕色带证据已补齐（evidence/M2/color_bars_2026-10-10.jpg，由学生录制的启动视频抽帧而得）。局限：该帧为分行刷中间态，不是静止完整的 8 条色带；且原始视频 17.9MB 受 .gitignore 的 *.mp4 规则限制未入库，链接文件中的网盘链接仍为待填占位符。"
  - "RGB 闪烁视频（6.4MB）受 .gitignore 第 23 行 “*.mp4” 规则限制未入库；链接文件 evidence/T0/rgb_blink_20261010.link.txt 中的网盘链接与提取码仍为待填占位符，须在里程碑提交前补齐（现仅本地可见）。"
  - "启动日志窗口不完整：CodeKit 串口监视器只保留最近 20~60 条记录，本次从 SDK 启动中期开始，不含 ROM / 引导阶段输出；如需完整引导日志需在缓冲区为空时重做一次采集。"
  - "板载无 RESET 键，复位只能靠拔插 USB；且要捕获上电瞬间的启动横幅，必须先建立串口监听再复位，否则横幅会错过。"
  - "本次烧录与启动由学生在 SiFli CodeKit 图形界面完成，终端侧未留下 sftool 原始 stdout；烧录证据取自 CodeKit 输出通道日志的逐字摘录（文件头已注明来源与行号）。"
  - "**HUD 底板会遮挡第 1 轨上部**：M3 第 3 步为修「音符盖住 HUD」加了 132×68 深灰底板（学生选方案 A），底板占 x=0..135、y=0..71，而 lane 0 覆盖 x=0..97，因此 lane 0 音符会先被挡住、下移到 y 大于 72 才重新可见。按落速 300px/s 折算约 280ms 不可见（仍保留约 1s 预读）。**这一条是按几何关系推算的，不是实测观察到的**（当轮 4 帧连续采样中音符都在 lane 2/3）。若后续觉得手感受影响，可缩窄底板或改成两行 HUD。"
  - "重开（RESULT 到 PLAYING）已验证可达并重新从头开始（第二条 `-> PLAYING at 48713ms (notes=58)`），但**重开后的那一局没打完**——串口抓取在 180 秒时结束，因此第二局的结算未被验证。"
  - "M3 两段实机视频（54MB、56MB）均因 .gitignore 的 *.mp4 规则未入库，链接文件见 evidence/M3/VID_20261017_134448.link.txt 与 VID_20261017_135523.link.txt，网盘链接与提取码仍为待填占位。"
  - "**帧率统计口径已在 M3 收口轮修正（L-11 已关闭）**：loop_stats() 现同时提供 avg/p95/max_ms（每帧 draw+flush 耗时）与 avg/p95/max_interval_ms（真正的帧间隔），自检第 3 节与 [LOOP] 行都分开打印，REQ-101 判据一律用后者。**口径修正后暴露出一个重要事实：真实帧间隔 p95=34ms 正好卡在 CR-04 的上限，每帧处理已占 31~32ms（其中 flush 29ms 等 VSYNC），只剩 1~2ms 余量。** 前几轮报的 avg=28ms 是 work 口径，不代表有余地。"
  - "**帧率余量很紧，是本项目当前最大的技术风险**：iv_max 已经到过 38ms（瞬时约 26fps），只因为占比不到 5% 才没拉高 p95；掉帧计数阈值是 33+5=38ms（需严格大于），也就是说**目前卡在边界上，拖到 39ms 就会开始计 drop**。后续若要加长按条、特效或判定文字动画，这 1~2ms 大概率不够。"
  - "**自检的注入 FAIL 是编译期开关造出来的**（SELFTEST_INJECT_BAD_CHART=1），不是运行时检测到真实坏数据。真实坏数据场景（例如 TF 卡上的谱面出错）属于 P1 范畴，未验证。"
  - "判定延迟直方图统计的是「触摸中断到判定执行」，**不是「触摸到画面翻转」**；后者仍需 GPIO 打点（对应 REQ-104 未闭合的那一半）。"
  - "自检的三节都在 TITLE 停留期间采样（第 3 节固定在 150 帧触发），**未覆盖长时间演奏下的帧率自检**；如果要看演奏中的自检数据，需要改成多次触发或延后触发时机。"
  - "**REQ-103 的「连续演奏」实际做成了「连续运行」**：11.2 分钟里学生玩了若干局并停留在主界面，不是从头到尾一直在演奏；未做自动演奏脚本。堆零漂移与不死机的结论成立，但不能写成「连续演奏 10min 通过」。"
  - "**帧率余量已降到 0~2ms**：11 分钟长跑后 work=33ms（flush 30ms），而目标帧间隔就是 33ms，帧循环已没有任何 rt_thread_delay 余量，靠「刚好赶上」在跑。p95 仍为 34ms 是因为抖动未超 38ms。**这是当前最大的技术风险**，M4 若要加长按条/特效/判定文字动画很可能掉帧。"

self_review: |
  M3「P0 功能」里程碑完成度：四步全部走完，REQ-001~REQ-007 七个 P0 需求均通过上板验证。

  完成得比较扎实的部分：
  - 判定引擎与计分：两局实机数据全部与手算一致（3150/54.31%、3350/57.75%），
    [HIT] 条数与结算的 P+G 完全对得上，批量测试 50/50。
  - 分层架构：fb / gfx / game_loop / input_touch / judge / chart / scene / selftest
    职责清晰，每步都能单独上板验证，没有一次性堆一大堆再调试。

  agent 不确定、必须如实标注的地方：
  1. **帧率**：真实帧间隔 p95=34ms 正好等于 CR-04 的上限，余量仅 1~2ms。这个结论是
     收口轮修正统计口径后才得到的；在此之前 agent 把「每帧处理耗时」当帧率上报，
     连续几轮得出「avg=28ms、还剩 5ms 余量」的偏乐观判断。这是本里程碑最大的方法论
     失误——指标定义没对准 REQ-101 的字面，虽已修正，但说明 agent 对口径不够严谨。
  2. **HUD 底板遮挡 lane 0 上部约 280ms**：这是按几何关系推算的，当轮 4 帧连续采样中
     音符都在 lane 2/3，**并未拍到实测画面**，不能当作已验证的结论。
  3. **判定延迟直方图**度量的是「触摸中断到判定执行」，不是「触摸到画面翻转」；
     REQ-104 的后半段仍未闭合。
  4. **自检注入的 FAIL** 是编译期开关造出来的，不是运行时检测到真实坏数据。

  由学生介入或纠正后才改的决策：
  - CR-04（REQ-101 判据由 33ms 放宽到 34ms）：agent 推荐先用 DWT 周期计数器做亚毫秒
    测量，学生否决并选择直接放宽判据。agent 按要求执行，但把「未测准」如实写进了 R-10。
  - HUD 布局：agent 给了三个方案及代价，学生选 A（加深色底板）。

  agent 自己引入的缺陷（均已修复并按「失败记录不覆盖」留档）：
  - B-005：往 rt_kprintf 里写中文，上板后全部变成 '?'。项目此前所有日志都是英文，
    这是第一次踩到 GCC 字符集转换的坑。
  - P-10：先启动串口抓取占住 COM9，紧接着要求学生烧录，导致烧录失败。
    串口是独占资源，正确顺序必须是「学生先烧录 → agent 再抓串口 → 学生复位」。
  - L-11：帧率统计口径错误（用处理耗时冒充帧间隔），影响了几轮的风险判断。

  未完成、不能声称达标的部分：
  - **REQ-103（连续 10min 不死机 + free heap 趋势）未测**，现有最长连续运行记录约 40 秒。
  - REQ-104 只闭合了一半（点击到状态切换已测，触摸到画面翻转未测）。
  - P1（REQ-008 音画同步 / REQ-009 音效反馈）未开始，依赖 TF 卡与喇叭到货。

