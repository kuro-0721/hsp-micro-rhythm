CONFIG_BSP_PWMT2_UPDATE_USING_DMA=y
CONFIG_RGB_SK6812MINI_HS_ENABLE=y
CONFIG_RGB_USING_SK6812MINI_HS_PWM_DEV_NAME="pwmt2"
CONFIG_BSP_USING_RGBLED_CH=1

# REQ-009 命中音效：启用 audio_server 框架，提供 audio_open2 / audio_write / audio_close
#
# 依据：完全照抄老师提供的 peripheral_lab 工程 —— 那份工程在黄山派这块板子上实测能出声，
#       其 build_sf32lb52-lchspi-ulp_hcpu/rtconfig.h 的音频宏为：
#         AUDIO / AUDIO_PATH_USING_HCI / AUDIO_USING_AUDPROC / AUDIO_USING_MANAGER
#         AUDIO_MIC_USING_CODEC / AUDIO_SPEAKER_USING_CODEC
#       且没有 AUDIO_BT_AUDIO。
#
# 2026-10-25 排查教训（两层）：
#   1) 只写 CONFIG_AUDIO_USING_MANAGER=y 而不写 CONFIG_AUDIO=y，会被 Kconfig 依赖检查丢弃，
#      .config 里根本不出现该项 —— 必须先开总开关 CONFIG_AUDIO=y。
#   2) 早先按「SDK 例程 proj.conf 都写 AUDIO_PATH_USING_HCPU」推测设了 HCPU 路径，
#      并让 AUDIO_BT_AUDIO 保持默认开启，结果 audio_open2 返回成功、audio_write 也返回写入成功，
#      但喇叭完全无声。逐项对比老师工程的 rtconfig.h 才发现路径与蓝牙音频这两处不同。
#      现在照抄能出声的配置：路径留默认 HCI，蓝牙音频显式关闭。
CONFIG_AUDIO=y
CONFIG_AUDIO_USING_MANAGER=y
CONFIG_AUDIO_USING_AUDPROC=y
CONFIG_AUDIO_MIC_USING_CODEC=y
CONFIG_AUDIO_SPEAKER_USING_CODEC=y
# CONFIG_AUDIO_BT_AUDIO is not set