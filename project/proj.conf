CONFIG_BSP_PWMT2_UPDATE_USING_DMA=y
CONFIG_RGB_SK6812MINI_HS_ENABLE=y
CONFIG_RGB_USING_SK6812MINI_HS_PWM_DEV_NAME="pwmt2"
CONFIG_BSP_USING_RGBLED_CH=1

# REQ-009 命中音效：启用 audio_server 框架，提供 audio_open2 / audio_write / audio_close
#
# 依据：完全照抄老师提供的 peripheral_lab 工程 —— 那份工程在黄山派这块板子上实测能出声，
#       其 build_sf32lb52-lchspi-ulp_hcpu/rtconfig.h 的音频宏为：
#         AUDIO / AUDIO_PATH_USING_HCI / AUDIO_USING_AUDPROC / AUDIO_USING_MANAGER
#         AUDIO_MIC_USING_CODEC / AUDIO_SPEAKER_USING_CODEC
#       且没有 AUDIO_BT_AUDIO。
#
# 2026-10-25 排查教训（两层）：
#   1) 只写 CONFIG_AUDIO_USING_MANAGER=y 而不写 CONFIG_AUDIO=y，会被 Kconfig 依赖检查丢弃，
#      .config 里根本不出现该项 —— 必须先开总开关 CONFIG_AUDIO=y。
#   2) 早先按「SDK 例程 proj.conf 都写 AUDIO_PATH_USING_HCPU」推测设了 HCPU 路径，
#      并让 AUDIO_BT_AUDIO 保持默认开启，结果 audio_open2 返回成功、audio_write 也返回写入成功，
#      但喇叭完全无声。逐项对比老师工程的 rtconfig.h 才发现路径与蓝牙音频这两处不同。
#      现在照抄能出声的配置：路径留默认 HCI，蓝牙音频显式关闭。
CONFIG_AUDIO=y
CONFIG_AUDIO_USING_MANAGER=y
CONFIG_AUDIO_USING_AUDPROC=y
CONFIG_AUDIO_MIC_USING_CODEC=y
CONFIG_AUDIO_SPEAKER_USING_CODEC=y
# CONFIG_AUDIO_BT_AUDIO is not set

# REQ-008（CR-05 后的实现方式：**内存嵌入 MP3**，不用 TF 卡）
#
# 为什么不启用 TF 卡（2026-10-31 实测结论）：
#   RT_USING_SPI_MSD 会通过 INIT_PREV_EXPORT(rt_spi_msd_init) 在 **main() 之前**
#   自动跑 SD 卡握手（rtos/rtthread/components/drivers/spi/spi_msd.c:2009）。
#   而它的卡检测分支依赖 MSD_SPI_TF_INSERT_DETE_PIN，这个宏全 SDK 没有 Kconfig 定义，
#   所以卡检测被跳过；同时 rt_device_open 强制带 DMA_RX|DMA_TX 标志。
#   结果：卡一旦不响应，系统在 main() 之前永久阻塞 —— 屏幕完全不亮（已实测两轮）。
#   因此 **不要** 打开 CONFIG_BSP_USING_SPI1 / CONFIG_RT_USING_SPI_MSD /
#   CONFIG_RT_USING_DFS_ELMFAT，否则会重新引入这个启动期死锁。
#
# AUDIO_LOCAL_MUSIC：mp3ctrl 解码链路依赖它（middleware/audio/Kconfig 第 28 行，
#   依赖 AUDIO_USING_AUDPROC && AUDIO && AUDIO_USING_MANAGER && BF0_HCPU，均已满足）。
CONFIG_AUDIO_LOCAL_MUSIC=y

# BGM 与命中音效共存：启用 SDK 官方 TX 软件混音
#
# 问题：mp3ctrl（BGM）和 sfx（命中音效）都用 AUDIO_TYPE_LOCAL_MUSIC。
#   默认 multi-client 关闭时，audio_server.c:2363-2385 的逻辑是「后来的客户端挂起先来的」，
#   导致音效一响 BGM 就停 —— 也就是之前「两者不能共存」的根因。
#
# 依据（middleware/audio/Kconfig:100-107）：
#   CONFIG_MULTI_CLIENTS_AT_WORKING  允许无硬件冲突的多客户端共存
#   CONFIG_SOFTWARE_TX_MIX_ENABLE    服务端把多路 TX 混音（依赖上一项）
#   两个都要开：只开前者时 is_can_mix() 仍返回 0，照样按优先级挂起。
#
# 开启后的行为（audio_server.c）：
#   - 2363 行起的 only_one_client 挂起逻辑被 #if !MULTI_CLIENTS_AT_WORKING 编译掉
#   - is_can_mix() 查 mix_policy[]，audio_server_internal.h:97 中
#     LOCAL_MUSIC_MIX_WITH = AUDIO_MIX_ALL，即 LOCAL_MUSIC 可与任意类型混音
#   - client_mix_process() 每 10ms 从两个 client 的 ring_buf 各取 TX_DMA_SIZE 相加
#     （(a>>1)+(b>>1)，两路都响时各降 6dB）
#   - 每个 client 自带 sifli_resample_t，采样率不同的那一路自动重采样到设备采样率
#     （本工程 BGM 44100、音效 48000）
#
# 内存开销：「big memory footprint」指 tx_mixed_pool = TX_DMA_SIZE*16 = 5KB，
#   加上每 client resample_dst[TX_DMA_SIZE] 640B —— 本板 PSRAM 8MB，可忽略。
#
# 教训：2026-10-31 曾用 audio_set_pcm_callback() 钩子自行改 PCM 缓冲做混音，
#   导致 TITLE 点击后系统卡死，已回退。不要再走那条路。
#
# ⚠ 2026-10-31 第一次开启失败（堆内存不够）：
#   Assertion failed at function:audio_client_init, line:3834 ,(handle->ring_pool)
#   total memory: 435388  used memory: 433244
#   根因不是混音本身，而是**系统堆只有 435KB 且帧缓冲占掉 351KB**。
#   已把帧缓冲搬到 PSRAM（src/fb.c，腾出 351KB），堆探针实测：
#     after fb_init free=426,212 / after mp3 open free=359,448
#   现在余量充足，再开下列两项。详见 docs/06。
CONFIG_MULTI_CLIENTS_AT_WORKING=y
CONFIG_SOFTWARE_TX_MIX_ENABLE=y